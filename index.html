<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Tab</title>
    <link rel="icon" href="data:;base64,i=" />
    <link rel="manifest" href="favicons/site.webmanifest" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div id="notification" class="hidden"></div>


    <div class="clock" id="clock">--:--</div>
    <div class="top-right" id="top-right"></div>
    <div class="shortcuts" id="shortcuts"></div>

    <div class="customize" id="customize" title="customize">
        <span class="customize-icon"></span>
        <span class="customize-label">Customize</span>
    </div>
    <div class="photo-credit" id="photo-credit" style="display: none">
        Photo by
        <a id="photo-credit-link" target="_blank" rel="noopener noreferrer"></a>
        on
        <span class="refresh-background" id="refresh-background" title="Get new background" style="display: none"><span
                class="refresh-icon"></span></span>
    </div>
    <div class="theme-toggle" title="Change theme">
        <span class="theme-icon"></span>
        <span class="theme-label">System</span>
    </div>
    <div class="art-grid"></div>
    <script src="defaultSettings.js"></script>
    <script type="module" src="main.js"></script>
</body>

</html>
